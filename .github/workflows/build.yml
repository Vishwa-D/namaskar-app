name: Build Namaskar Detection APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/example/namaskarapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/raw
          mkdir -p app/src/main/assets

          # 1. gradle.properties (Enables AndroidX support)
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # 2. Download Google MediaPipe Hand AI Model
          curl -L -o app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

          # 3. Download Authentic "OM" Chant Audio
          curl -L -A "Mozilla/5.0" -o app/src/main/res/raw/om.ogg "https://commons.wikimedia.org/wiki/Special:FilePath/Om_pro.ogg" || true

          # 4. Settings configuration
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NamaskarApp"
          include(":app")
          EOF

          # 5. Root build configuration
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          # 6. App build configuration
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.namaskarapp"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.namaskarapp"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")

              val cameraxVersion = "1.3.3"
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")

              implementation("com.google.mediapipe:tasks-vision:0.10.14")
          }
          EOF

          # 7. Android Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="Namaskar AI"
                  android:roundIcon="@android:drawable/ic_dialog_info"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 8. User Interface Layout (Completely Blank Black Overlay)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <!-- Camera Feed View -->
              <androidx.camera.view.PreviewView
                  android:id="@+id/previewView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <!-- Top Bar: Status and Camera Switch Button -->
              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:padding="12dp"
                  app:layout_constraintTop_toTopOf="parent">

                  <TextView
                      android:id="@+id/statusText"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:background="#CC000000"
                      android:gravity="center_vertical"
                      android:padding="12dp"
                      android:text="Waiting for Namaskar..."
                      android:textColor="#FFFFFF"
                      android:textSize="14sp"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnSwitchCamera"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:backgroundTint="#424242"
                      android:text="🔄 Cam: Rear"
                      android:textSize="12sp" />
              </LinearLayout>

              <!-- Bottom Control Settings Card -->
              <com.google.android.material.card.MaterialCardView
                  android:id="@+id/controlsCard"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_margin="14dp"
                  app:cardBackgroundColor="#E61E1E1E"
                  app:cardCornerRadius="14dp"
                  app:cardElevation="6dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Audio on Gesture Recognized:"
                          android:textColor="#B0BEC5"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <!-- Sound Mode Radio Buttons -->
                      <RadioGroup
                          android:id="@+id/radioGroupAudio"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="4dp"
                          android:orientation="vertical">

                          <RadioButton
                              android:id="@+id/rbAudioOm"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:checked="true"
                              android:text="Play Default 'OM' Sound"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp" />

                          <RadioButton
                              android:id="@+id/rbAudioCustom"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="Play From Custom Audios"
                              android:textColor="#FFFFFF"
                              android:textSize="14sp" />
                      </RadioGroup>

                      <TextView
                          android:id="@+id/audioFilesCountText"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="4dp"
                          android:text="Custom Audios Loaded: 0"
                          android:textColor="#9E9E9E"
                          android:textSize="12sp" />

                      <!-- Audio Buttons: Add, Test, Clear -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnAddAudio"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginEnd="4dp"
                              android:layout_weight="1"
                              android:text="+ Add"
                              android:textSize="12sp" />

                          <Button
                              android:id="@+id/btnTestAudio"
                              style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginEnd="4dp"
                              android:layout_weight="1"
                              android:text="▶ Test"
                              android:textColor="#4CAF50"
                              android:textSize="12sp" />

                          <Button
                              android:id="@+id/btnClearAudio"
                              style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Clear"
                              android:textColor="#FF5252"
                              android:textSize="12sp" />
                      </LinearLayout>

                      <!-- Enable Black Screen Button -->
                      <Button
                          android:id="@+id/btnEnableStealth"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:backgroundTint="#263238"
                          android:text="🌙 Enable Black Screen Mode"
                          android:textSize="13sp" />
                  </LinearLayout>
              </com.google.android.material.card.MaterialCardView>

              <!-- 100% Pitch-Black Overlay: Pure Black, Zero Buttons, Zero Text -->
              <View
                  android:id="@+id/blackScreenOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:clickable="true"
                  android:focusable="true"
                  android:visibility="gone" />

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # 9. Application Logic (Immersive Fullscreen Blackout + Double Tap Wake)
          cat << 'EOF' > app/src/main/java/com/example/namaskarapp/MainActivity.kt
          package com.example.namaskarapp

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.media.AudioAttributes
          import android.media.AudioDeviceInfo
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowInsets
          import android.view.WindowInsetsController
          import android.view.WindowManager
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.tasks.core.BaseOptions
          import com.google.mediapipe.tasks.vision.core.RunningMode
          import com.google.mediapipe.tasks.vision.handlandmarker.HandLandmarker
          import com.google.mediapipe.tasks.vision.handlandmarker.HandLandmarkerResult
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.hypot
          import kotlin.random.Random

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var statusText: TextView
              private lateinit var btnSwitchCamera: Button
              private lateinit var audioFilesCountText: TextView
              private lateinit var rbAudioOm: RadioButton
              private lateinit var rbAudioCustom: RadioButton
              private lateinit var btnAddAudio: Button
              private lateinit var btnTestAudio: Button
              private lateinit var btnClearAudio: Button
              private lateinit var btnEnableStealth: Button
              private lateinit var blackScreenOverlay: View

              private var cameraProvider: ProcessCameraProvider? = null
              private var lensFacing = CameraSelector.LENS_FACING_BACK
              private lateinit var cameraExecutor: ExecutorService
              private lateinit var handLandmarker: HandLandmarker
              private var mediaPlayer: MediaPlayer? = null

              private val audioFilesList = mutableListOf<File>()
              private var lastTriggerTime = 0L

              private val selectAudiosLauncher = registerForActivityResult(
                  ActivityResultContracts.GetMultipleContents()
              ) { uris: List<Uri>? ->
                  uris?.let { importAudioFiles(it) }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)

                  previewView = findViewById(R.id.previewView)
                  statusText = findViewById(R.id.statusText)
                  btnSwitchCamera = findViewById(R.id.btnSwitchCamera)
                  audioFilesCountText = findViewById(R.id.audioFilesCountText)
                  rbAudioOm = findViewById(R.id.rbAudioOm)
                  rbAudioCustom = findViewById(R.id.rbAudioCustom)
                  btnAddAudio = findViewById(R.id.btnAddAudio)
                  btnTestAudio = findViewById(R.id.btnTestAudio)
                  btnClearAudio = findViewById(R.id.btnClearAudio)
                  btnEnableStealth = findViewById(R.id.btnEnableStealth)
                  blackScreenOverlay = findViewById(R.id.blackScreenOverlay)

                  cameraExecutor = Executors.newSingleThreadExecutor()

                  ensureOmChantReady()
                  loadExistingAudioFiles()
                  setupUIEvents()
                  initMediaPipe()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      initCameraProvider()
                  } else {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                  }
              }

              private fun setupUIEvents() {
                  btnSwitchCamera.setOnClickListener {
                      lensFacing = if (lensFacing == CameraSelector.LENS_FACING_BACK) {
                          CameraSelector.LENS_FACING_FRONT
                      } else {
                          CameraSelector.LENS_FACING_BACK
                      }
                      btnSwitchCamera.text = if (lensFacing == CameraSelector.LENS_FACING_FRONT) "🔄 Cam: Front" else "🔄 Cam: Rear"
                      bindCameraUseCases()
                  }

                  btnAddAudio.setOnClickListener {
                      selectAudiosLauncher.launch("audio/*")
                  }

                  btnTestAudio.setOnClickListener {
                      playAudioOnLoudspeaker()
                      Toast.makeText(this, "Testing sound on loudspeaker...", Toast.LENGTH_SHORT).show()
                  }

                  btnClearAudio.setOnClickListener {
                      val audioDir = File(filesDir, "audio_tracks")
                      if (audioDir.exists()) audioDir.listFiles()?.forEach { it.delete() }
                      audioFilesList.clear()
                      updateAudioCountUI()
                      rbAudioOm.isChecked = true
                      Toast.makeText(this, "Cleared custom audios (Switched to OM)", Toast.LENGTH_SHORT).show()
                  }

                  // Enter 100% pure black mode (Hides system status & navigation bars)
                  btnEnableStealth.setOnClickListener {
                      enterBlackScreenMode()
                  }

                  // Double tap anywhere to exit black screen mode
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (blackScreenOverlay.visibility == View.VISIBLE) {
                              exitBlackScreenMode()
                              return true
                          }
                          return super.onDoubleTap(e)
                      }
                  })

                  blackScreenOverlay.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      true
                  }
              }

              private fun enterBlackScreenMode() {
                  Toast.makeText(this, "Screen turned off. Double-tap to wake up.", Toast.LENGTH_SHORT).show()
                  blackScreenOverlay.visibility = View.VISIBLE

                  // Hide system navigation bar and status bar completely
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.let {
                          it.hide(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                          it.systemBarsBehavior = WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = (
                          View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      )
                  }
              }

              private fun exitBlackScreenMode() {
                  blackScreenOverlay.visibility = View.GONE

                  // Restore system bars
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      window.insetsController?.show(WindowInsets.Type.statusBars() or WindowInsets.Type.navigationBars())
                  } else {
                      @Suppress("DEPRECATION")
                      window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  }
              }

              private fun initCameraProvider() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                  cameraProviderFuture.addListener({
                      cameraProvider = cameraProviderFuture.get()
                      bindCameraUseCases()
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun bindCameraUseCases() {
                  val provider = cameraProvider ?: return
                  val preview = Preview.Builder().build().also {
                      it.setSurfaceProvider(previewView.surfaceProvider)
                  }

                  val imageAnalysis = ImageAnalysis.Builder()
                      .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                      .build()
                      .also {
                          it.setAnalyzer(cameraExecutor) { imageProxy ->
                              processCameraFrame(imageProxy)
                          }
                      }

                  val cameraSelector = CameraSelector.Builder().requireLensFacing(lensFacing).build()

                  try {
                      provider.unbindAll()
                      provider.bindToLifecycle(this, cameraSelector, preview, imageAnalysis)
                  } catch (e: Exception) {
                      e.printStackTrace()
                      Toast.makeText(this, "Failed to start camera", Toast.LENGTH_SHORT).show()
                  }
              }

              @androidx.annotation.OptIn(ExperimentalGetImage::class)
              private fun processCameraFrame(imageProxy: ImageProxy) {
                  try {
                      val bitmap = imageProxy.toBitmap()
                      val rotation = imageProxy.imageInfo.rotationDegrees
                      val rotatedBitmap = if (rotation != 0) {
                          val matrix = Matrix().apply { postRotate(rotation.toFloat()) }
                          Bitmap.createBitmap(bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true)
                      } else {
                          bitmap
                      }

                      val mpImage = BitmapImageBuilder(rotatedBitmap).build()
                      val result = handLandmarker.detect(mpImage)
                      evaluateNamaskarGesture(result)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  } finally {
                      imageProxy.close()
                  }
              }

              private fun evaluateNamaskarGesture(result: HandLandmarkerResult) {
                  val hands = result.landmarks()
                  if (hands.size >= 2) {
                      val handA = hands[0]
                      val handB = hands[1]

                      val wristA = handA[0]
                      val wristB = handB[0]
                      val tipA = handA[12]
                      val tipB = handB[12]

                      val handScaleA = hypot((wristA.x() - tipA.x()).toDouble(), (wristA.y() - tipA.y()).toDouble())
                      val handScaleB = hypot((wristB.x() - tipB.x()).toDouble(), (wristB.y() - tipB.y()).toDouble())
                      val avgHandSize = (handScaleA + handScaleB) / 2.0

                      if (avgHandSize < 0.05) return

                      val wristDistance = hypot((wristA.x() - wristB.x()).toDouble(), (wristA.y() - wristB.y()).toDouble())
                      val tipDistance = hypot((tipA.x() - tipB.x()).toDouble(), (tipA.y() - tipB.y()).toDouble())

                      val isHandsTouching = (wristDistance < avgHandSize * 1.35) && (tipDistance < avgHandSize * 0.95)
                      val isFingersUpward = (tipA.y() < wristA.y() - 0.02f) && (tipB.y() < wristB.y() - 0.02f)
                      val avgYPosition = (wristA.y() + wristB.y() + tipA.y() + tipB.y()) / 4.0f
                      val isFaceToChestZone = avgYPosition in 0.08f..0.88f

                      if (isHandsTouching && isFingersUpward && isFaceToChestZone) {
                          val currentTime = System.currentTimeMillis()
                          if (currentTime - lastTriggerTime > 4000) {
                              lastTriggerTime = currentTime
                              runOnUiThread {
                                  statusText.text = "🙏 Namaskar! Playing Audio..."
                                  statusText.setBackgroundColor(0xDD2E7D32.toInt())
                                  playAudioOnLoudspeaker()
                              }
                              Handler(Looper.getMainLooper()).postDelayed({
                                  statusText.text = "Waiting for Namaskar..."
                                  statusText.setBackgroundColor(0xCC000000.toInt())
                              }, 3500)
                          }
                      }
                  }
              }

              private fun playAudioOnLoudspeaker() {
                  try {
                      mediaPlayer?.release()
                      mediaPlayer = MediaPlayer().apply {
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .build()
                          )

                          val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                              val speakerDevice = audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS)
                                  .firstOrNull { it.type == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER }
                              speakerDevice?.let { preferredDevice = it }
                          }

                          if (rbAudioOm.isChecked) {
                              val rawResId = resources.getIdentifier("om", "raw", packageName)
                              if (rawResId != 0) {
                                  val afd = resources.openRawResourceFd(rawResId)
                                  setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                                  afd.close()
                              } else {
                                  val omFile = File(filesDir, "om_chant.wav")
                                  setDataSource(omFile.absolutePath)
                              }
                          } else {
                              if (audioFilesList.isEmpty()) {
                                  val omFile = File(filesDir, "om_chant.wav")
                                  setDataSource(omFile.absolutePath)
                              } else {
                                  val randomFile = audioFilesList.random()
                                  setDataSource(randomFile.absolutePath)
                              }
                          }

                          prepare()
                          start()
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun ensureOmChantReady() {
                  val omFile = File(filesDir, "om_chant.wav")
                  if (omFile.exists() && omFile.length() > 5000) return

                  val sampleRate = 22050
                  val totalSamples = (sampleRate * 2.8).toInt()
                  val rawData = ShortArray(totalSamples)

                  val freq1 = 136.1
                  val freq2 = 272.2
                  val freq3 = 408.3

                  for (i in 0 until totalSamples) {
                      val t = i.toDouble() / sampleRate
                      val envelope = (if (t < 0.3) t / 0.3 else 1.0) * Math.exp(-1.1 * t)
                      val sample = (0.6 * Math.sin(2.0 * Math.PI * freq1 * t) +
                                    0.28 * Math.sin(2.0 * Math.PI * freq2 * t) +
                                    0.12 * Math.sin(2.0 * Math.PI * freq3 * t)) * envelope
                      rawData[i] = (sample * 32000).toInt().coerceIn(-32767, 32767).toShort()
                  }

                  try {
                      FileOutputStream(omFile).use { fos ->
                          writeWavHeader(fos, totalSamples * 2, sampleRate)
                          val byteBuffer = java.nio.ByteBuffer.allocate(totalSamples * 2).order(java.nio.ByteOrder.LITTLE_ENDIAN)
                          for (s in rawData) byteBuffer.putShort(s)
                          fos.write(byteBuffer.array())
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              private fun writeWavHeader(out: FileOutputStream, pcmSize: Int, sampleRate: Int) {
                  val totalSize = pcmSize + 36
                  val byteRate = sampleRate * 2
                  val header = ByteArray(44)
                  header[0] = 'R'.code.toByte(); header[1] = 'I'.code.toByte(); header[2] = 'F'.code.toByte(); header[3] = 'F'.code.toByte()
                  header[4] = (totalSize and 0xff).toByte(); header[5] = ((totalSize shr 8) and 0xff).toByte()
                  header[6] = ((totalSize shr 16) and 0xff).toByte(); header[7] = ((totalSize shr 24) and 0xff).toByte()
                  header[8] = 'W'.code.toByte(); header[9] = 'A'.code.toByte(); header[10] = 'V'.code.toByte(); header[11] = 'E'.code.toByte()
                  header[12] = 'f'.code.toByte(); header[13] = 'm'.code.toByte(); header[14] = 't'.code.toByte(); header[15] = ' '.code.toByte()
                  header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0
                  header[20] = 1; header[21] = 0; header[22] = 1; header[23] = 0
                  header[24] = (sampleRate and 0xff).toByte(); header[25] = ((sampleRate shr 8) and 0xff).toByte()
                  header[26] = ((sampleRate shr 16) and 0xff).toByte(); header[27] = ((sampleRate shr 24) and 0xff).toByte()
                  header[28] = (byteRate and 0xff).toByte(); header[29] = ((byteRate shr 8) and 0xff).toByte()
                  header[30] = ((byteRate shr 16) and 0xff).toByte(); header[31] = ((byteRate shr 24) and 0xff).toByte()
                  header[32] = 2; header[33] = 0; header[34] = 16; header[35] = 0
                  header[36] = 'd'.code.toByte(); header[37] = 'a'.code.toByte(); header[38] = 't'.code.toByte(); header[39] = 'a'.code.toByte()
                  header[40] = (pcmSize and 0xff).toByte(); header[41] = ((pcmSize shr 8) and 0xff).toByte()
                  header[42] = ((pcmSize shr 16) and 0xff).toByte(); header[43] = ((pcmSize shr 24) and 0xff).toByte()
                  out.write(header)
              }

              private fun importAudioFiles(uris: List<Uri>) {
                  val audioDir = File(filesDir, "audio_tracks").apply { if (!exists()) mkdirs() }
                  var count = 0
                  uris.forEach { uri ->
                      try {
                          contentResolver.openInputStream(uri)?.use { input ->
                              val destFile = File(audioDir, "track_${System.currentTimeMillis()}_${Random.nextInt(1000)}.mp3")
                              FileOutputStream(destFile).use { output -> input.copyTo(output) }
                              audioFilesList.add(destFile)
                              count++
                          }
                      } catch (e: Exception) { e.printStackTrace() }
                  }
                  updateAudioCountUI()
                  rbAudioCustom.isChecked = true
                  Toast.makeText(this, "Added $count audio(s) & switched to Custom Audio", Toast.LENGTH_SHORT).show()
              }

              private fun loadExistingAudioFiles() {
                  audioFilesList.clear()
                  val audioDir = File(filesDir, "audio_tracks")
                  if (audioDir.exists()) {
                      audioDir.listFiles()?.filter { it.isFile }?.let { audioFilesList.addAll(it) }
                  }
                  updateAudioCountUI()
              }

              private fun updateAudioCountUI() {
                  audioFilesCountText.text = "Custom Audios Loaded: ${audioFilesList.size}"
              }

              private fun initMediaPipe() {
                  val baseOptions = BaseOptions.builder().setModelAssetPath("hand_landmarker.task").build()
                  val options = HandLandmarker.HandLandmarkerOptions.builder()
                      .setBaseOptions(baseOptions)
                      .setRunningMode(RunningMode.IMAGE)
                      .setNumHands(2)
                      .setMinHandDetectionConfidence(0.5f)
                      .setMinHandPresenceConfidence(0.5f)
                      .setMinTrackingConfidence(0.5f)
                      .build()
                  handLandmarker = HandLandmarker.createFromOptions(this, options)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      initCameraProvider()
                  } else {
                      Toast.makeText(this, "Camera permission is required", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  cameraExecutor.shutdown()
                  mediaPlayer?.release()
                  if (::handLandmarker.isInitialized) handLandmarker.close()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Namaskar-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
