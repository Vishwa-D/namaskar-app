name: Build Namaskar Detection APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$(pwd)/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Generate Complete Android Project
        run: |
          mkdir -p app/src/main/java/com/example/namaskarapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          # 1. Download Google MediaPipe Hand Detection AI Model
          curl -L -o app/src/main/assets/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task

          # 2. Settings configuration
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NamaskarApp"
          include(":app")
          EOF

          # 3. Root build configuration
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          # 4. App dependencies configuration
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.namaskarapp"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.namaskarapp"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")

              val cameraxVersion = "1.3.3"
              implementation("androidx.camera:camera-core:$cameraxVersion")
              implementation("androidx.camera:camera-camera2:$cameraxVersion")
              implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
              implementation("androidx.camera:camera-view:$cameraxVersion")

              implementation("com.google.mediapipe:tasks-vision:0.10.14")
          }
          EOF

          # 5. App permissions and manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_dialog_info"
                  android:label="Namaskar AI"
                  android:roundIcon="@android:drawable/ic_dialog_info"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Screen UI Layout (Camera + Audio Buttons + Stealth Black Screen)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.camera.view.PreviewView
                  android:id="@+id/previewView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_margin="16dp"
                  android:background="#CC000000"
                  android:gravity="center"
                  android:padding="14dp"
                  android:text="Waiting for Namaskar gesture..."
                  android:textColor="#FFFFFF"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />

              <com.google.android.material.card.MaterialCardView
                  android:id="@+id/controlsCard"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_margin="16dp"
                  app:cardBackgroundColor="#E6212121"
                  app:cardCornerRadius="16dp"
                  app:cardElevation="6dp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="16dp">

                      <TextView
                          android:id="@+id/audioFilesCountText"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="center"
                          android:text="Audio Files Loaded: 0"
                          android:textColor="#E0E0E0"
                          android:textSize="14sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnAddAudio"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginEnd="6dp"
                              android:layout_weight="1"
                              android:text="Add Audios" />

                          <Button
                              android:id="@+id/btnClearAudio"
                              style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="6dp"
                              android:layout_weight="1"
                              android:text="Clear All"
                              android:textColor="#FF5252" />
                      </LinearLayout>

                      <Button
                          android:id="@+id/btnStealthMode"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:backgroundTint="#424242"
                          android:text="Enter Black Screen Mode" />
                  </LinearLayout>
              </com.google.android.material.card.MaterialCardView>

              <FrameLayout
                  android:id="@+id/blackScreenOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:clickable="true"
                  android:focusable="true"
                  android:visibility="gone">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="bottom|center_horizontal"
                      android:layout_marginBottom="32dp"
                      android:alpha="0.2"
                      android:text="Double-tap anywhere to wake screen"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp" />
              </FrameLayout>

          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          # 7. Complete Application Logic
          cat << 'EOF' > app/src/main/java/com/example/namaskarapp/MainActivity.kt
          package com.example.namaskarapp

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.media.AudioAttributes
          import android.media.AudioDeviceInfo
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.*
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.google.mediapipe.framework.image.BitmapImageBuilder
          import com.google.mediapipe.tasks.core.BaseOptions
          import com.google.mediapipe.tasks.vision.core.RunningMode
          import com.google.mediapipe.tasks.vision.handlandmarker.HandLandmarker
          import com.google.mediapipe.tasks.vision.handlandmarker.HandLandmarkerResult
          import java.io.File
          import java.io.FileOutputStream
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.hypot
          import kotlin.random.Random

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var statusText: TextView
              private lateinit var audioFilesCountText: TextView
              private lateinit var btnAddAudio: Button
              private lateinit var btnClearAudio: Button
              private lateinit var btnStealthMode: Button
              private lateinit var blackScreenOverlay: FrameLayout

              private lateinit var cameraExecutor: ExecutorService
              private lateinit var handLandmarker: HandLandmarker
              private var mediaPlayer: MediaPlayer? = null

              private val audioFilesList = mutableListOf<File>()
              private var lastTriggerTime = 0L

              private val selectAudiosLauncher = registerForActivityResult(
                  ActivityResultContracts.GetMultipleContents()
              ) { uris: List<Uri>? ->
                  uris?.let { importAudioFiles(it) }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  // Keep screen awake so the camera never stops
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)

                  previewView = findViewById(R.id.previewView)
                  statusText = findViewById(R.id.statusText)
                  audioFilesCountText = findViewById(R.id.audioFilesCountText)
                  btnAddAudio = findViewById(R.id.btnAddAudio)
                  btnClearAudio = findViewById(R.id.btnClearAudio)
                  btnStealthMode = findViewById(R.id.btnStealthMode)
                  blackScreenOverlay = findViewById(R.id.blackScreenOverlay)

                  cameraExecutor = Executors.newSingleThreadExecutor()

                  loadExistingAudioFiles()
                  setupButtons()
                  setupDoubleTapToWake()
                  initMediaPipe()

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      startCamera()
                  } else {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 101)
                  }
              }

              private fun setupButtons() {
                  btnAddAudio.setOnClickListener {
                      selectAudiosLauncher.launch("audio/*")
                  }

                  btnClearAudio.setOnClickListener {
                      val audioDir = File(filesDir, "audio_tracks")
                      if (audioDir.exists()) {
                          audioDir.listFiles()?.forEach { it.delete() }
                      }
                      audioFilesList.clear()
                      updateAudioCountUI()
                      Toast.makeText(this, "All audios cleared", Toast.LENGTH_SHORT).show()
                  }

                  btnStealthMode.setOnClickListener {
                      blackScreenOverlay.visibility = View.VISIBLE
                  }
              }

              private fun setupDoubleTapToWake() {
                  val gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                      override fun onDoubleTap(e: MotionEvent): Boolean {
                          if (blackScreenOverlay.visibility == View.VISIBLE) {
                              blackScreenOverlay.visibility = View.GONE
                              return true
                          }
                          return super.onDoubleTap(e)
                      }
                  })

                  blackScreenOverlay.setOnTouchListener { _, event ->
                      gestureDetector.onTouchEvent(event)
                      true
                  }
              }

              private fun importAudioFiles(uris: List<Uri>) {
                  val audioDir = File(filesDir, "audio_tracks").apply { if (!exists()) mkdirs() }
                  var importedCount = 0

                  uris.forEach { uri ->
                      try {
                          contentResolver.openInputStream(uri)?.use { inputStream ->
                              val destFile = File(audioDir, "track_${System.currentTimeMillis()}_${Random.nextInt(1000)}.mp3")
                              FileOutputStream(destFile).use { outputStream ->
                                  inputStream.copyTo(outputStream)
                              }
                              audioFilesList.add(destFile)
                              importedCount++
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }

                  updateAudioCountUI()
                  Toast.makeText(this, "Added $importedCount audio(s)", Toast.LENGTH_SHORT).show()
              }

              private fun loadExistingAudioFiles() {
                  audioFilesList.clear()
                  val audioDir = File(filesDir, "audio_tracks")
                  if (audioDir.exists()) {
                      audioDir.listFiles()?.filter { it.isFile }?.let {
                          audioFilesList.addAll(it)
                      }
                  }
                  updateAudioCountUI()
              }

              private fun updateAudioCountUI() {
                  audioFilesCountText.text = "Audio Files Loaded: ${audioFilesList.size}"
              }

              private fun initMediaPipe() {
                  val baseOptions = BaseOptions.builder()
                      .setModelAssetPath("hand_landmarker.task")
                      .build()
                  val options = HandLandmarker.HandLandmarkerOptions.builder()
                      .setBaseOptions(baseOptions)
                      .setRunningMode(RunningMode.IMAGE)
                      .setNumHands(2)
                      .setMinHandDetectionConfidence(0.5f)
                      .setMinHandPresenceConfidence(0.5f)
                      .setMinTrackingConfidence(0.5f)
                      .build()
                  handLandmarker = HandLandmarker.createFromOptions(this, options)
              }

              private fun startCamera() {
                  val cameraProviderFuture = ProcessCameraProvider.getInstance(this)
                  cameraProviderFuture.addListener({
                      val cameraProvider = cameraProviderFuture.get()
                      val preview = Preview.Builder().build().also {
                          it.setSurfaceProvider(previewView.surfaceProvider)
                      }

                      val imageAnalysis = ImageAnalysis.Builder()
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()
                          .also {
                              it.setAnalyzer(cameraExecutor) { imageProxy ->
                                  processCameraFrame(imageProxy)
                              }
                          }

                      val cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA

                      try {
                          cameraProvider.unbindAll()
                          cameraProvider.bindToLifecycle(this, cameraSelector, preview, imageAnalysis)
                      } catch (e: Exception) {
                          e.printStackTrace()
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              @androidx.annotation.OptIn(ExperimentalGetImage::class)
              private fun processCameraFrame(imageProxy: ImageProxy) {
                  try {
                      val bitmap = imageProxy.toBitmap()
                      val rotation = imageProxy.imageInfo.rotationDegrees
                      val rotatedBitmap = if (rotation != 0) {
                          val matrix = Matrix().apply { postRotate(rotation.toFloat()) }
                          Bitmap.createBitmap(bitmap, 0, 0, bitmap.width, bitmap.height, matrix, true)
                      } else {
                          bitmap
                      }

                      val mpImage = BitmapImageBuilder(rotatedBitmap).build()
                      val result = handLandmarker.detect(mpImage)
                      evaluateNamaskarGesture(result)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  } finally {
                      imageProxy.close()
                  }
              }

              private fun evaluateNamaskarGesture(result: HandLandmarkerResult) {
                  val hands = result.landmarks()
                  if (hands.size >= 2) {
                      val handA = hands[0]
                      val handB = hands[1]

                      val wristA = handA[0]
                      val wristB = handB[0]
                      val tipA = handA[12]
                      val tipB = handB[12]

                      // Scale invariant: adapts to sitting close or standing further away
                      val handScaleA = hypot((wristA.x() - tipA.x()).toDouble(), (wristA.y() - tipA.y()).toDouble())
                      val handScaleB = hypot((wristB.x() - tipB.x()).toDouble(), (wristB.y() - tipB.y()).toDouble())
                      val avgHandSize = (handScaleA + handScaleB) / 2.0

                      if (avgHandSize < 0.05) return

                      val wristDistance = hypot((wristA.x() - wristB.x()).toDouble(), (wristA.y() - wristB.y()).toDouble())
                      val tipDistance = hypot((tipA.x() - tipB.x()).toDouble(), (tipA.y() - tipB.y()).toDouble())

                      // 1. Hands touching
                      val isHandsTouching = (wristDistance < avgHandSize * 1.3) && (tipDistance < avgHandSize * 0.9)

                      // 2. Upright hand posture
                      val isFingersUpward = (tipA.y() < wristA.y() - 0.03f) && (tipB.y() < wristB.y() - 0.03f)

                      // 3. Covers chest to face height
                      val avgYPosition = (wristA.y() + wristB.y() + tipA.y() + tipB.y()) / 4.0f
                      val isFaceToChestZone = avgYPosition in 0.10f..0.85f

                      if (isHandsTouching && isFingersUpward && isFaceToChestZone) {
                          val currentTime = System.currentTimeMillis()
                          if (currentTime - lastTriggerTime > 4000) {
                              lastTriggerTime = currentTime
                              runOnUiThread {
                                  statusText.text = "🙏 Namaskar Detected! Playing Audio."
                                  statusText.setBackgroundColor(0xDD2E7D32.toInt())
                                  playRandomAudioOnLoudspeaker()
                              }
                              Handler(Looper.getMainLooper()).postDelayed({
                                  statusText.text = "Waiting for Namaskar gesture..."
                                  statusText.setBackgroundColor(0xCC000000.toInt())
                              }, 3500)
                          }
                      }
                  }
              }

              private fun playRandomAudioOnLoudspeaker() {
                  if (audioFilesList.isEmpty()) {
                      Toast.makeText(this, "Namaskar detected! Please add audio files first.", Toast.LENGTH_SHORT).show()
                      return
                  }

                  val randomFile = audioFilesList.random()

                  try {
                      mediaPlayer?.release()
                      mediaPlayer = MediaPlayer().apply {
                          setDataSource(randomFile.absolutePath)
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .build()
                          )

                          // Always route through phone loudspeaker
                          val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              val speakerDevice = audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS)
                                  .firstOrNull { it.type == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER }
                              speakerDevice?.let { preferredDevice = it }
                          }

                          prepare()
                          start()
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 101 && grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startCamera()
                  } else {
                      Toast.makeText(this, "Camera permission is required", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  cameraExecutor.shutdown()
                  mediaPlayer?.release()
                  if (::handLandmarker.isInitialized) {
                      handLandmarker.close()
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Namaskar-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
